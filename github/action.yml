name: Generate klee artefact
description: Creates a klee artefact for a pull request and posts its link.
inputs:
    api-url:
        description: Public klee API URL, without a trailing slash.
        required: true
    pull-request:
        description: Pull request number.
        required: true
outputs:
    artefact-url:
        description: The created klee artefact URL.
        value: ${{ steps.create.outputs.artefact-url }}
runs:
    using: composite
    steps:
        - id: create
          shell: node {0}
          env:
              API_URL: ${{ inputs.api-url }}
              PULL_REQUEST: ${{ inputs.pull-request }}
          run: |
              (async () => {
                async function fetchWithRetry(url, options) {
                  let error;
                  for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                      const response = await fetch(url, options);
                      if (response.ok || response.status < 500) return response;
                      error = new Error(`request failed (${response.status})`);
                    } catch (cause) {
                      error = cause;
                    }
                    if (attempt < 3) await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                  }
                  throw error;
                }
                const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
                requestUrl.searchParams.set("audience", process.env.API_URL);
                const oidc = await fetchWithRetry(requestUrl, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } }).then(response => response.ok ? response.json() : Promise.reject(new Error(`GitHub OIDC request failed (${response.status})`)));
                const response = await fetch(`${process.env.API_URL}/api/integrations/github/actions/artefacts`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: oidc.value, pullRequest: Number(process.env.PULL_REQUEST) }) });
                if (!response.ok) throw new Error(`klee request failed (${response.status}): ${await response.text()}`);
                const artefact = await response.json();
                await require("node:fs").promises.appendFile(process.env.GITHUB_OUTPUT, `artefact-url=${artefact.url}\n`);
              })().catch(error => { console.error(error); process.exitCode = 1; });
